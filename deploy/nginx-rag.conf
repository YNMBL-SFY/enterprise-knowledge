# 企业知识库 nginx 反向代理配置
# 作用：http://<服务器IP>/rag/  →  http://127.0.0.1:1111/（去掉 /rag 前缀转发）
# 部署：复制到 /etc/nginx/conf.d/rag.conf 后 nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name _;

    # 上传的 Markdown 可能较大，放宽 body 限制
    client_max_body_size 10m;

    # 根路径直接跳转到 /rag/
    location = / {
        return 301 /rag/;
    }

    # 关键：/rag/ 前缀重写后转发给 uvicorn（uvicorn 自身路由不含前缀）
    location /rag/ {
        proxy_pass http://127.0.0.1:1111/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # 知识问答/向量化可能较慢
        proxy_send_timeout 120s;
    }
}
